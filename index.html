  <style>
    :root {
      --bg-paper: #f6f1e7;
      --card-bg: #fffdf9;
      --ink-primary: #231f20;
      --ink-muted: #5e564d;
      --accent-burgundy: #6e262c;
      --accent-gold: #b08d57;
      --border-line: #dcd3c1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: 'Noto Serif TC', Georgia, serif;
      line-height: 1.7;
      padding-bottom: 4rem;
    }

    header {
      text-align: center;
      padding: 3rem 1.5rem 2rem;
      border-bottom: 1px solid var(--border-line);
      background: radial-gradient(circle at top, #fcf9f2 0%, var(--bg-paper) 100%);
    }

    .subtitle-top {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      margin: 0.3rem 0;
      color: var(--ink-primary);
    }

    .header-desc {
      color: var(--ink-muted);
      font-size: 0.95rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* A-Z 導覽列 */
    .az-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      max-width: 960px;
      margin: 1.8rem auto;
      padding: 0 1rem;
    }

    .az-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-line);
      background: var(--card-bg);
      color: var(--ink-primary);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 4px;
    }

    .az-btn:hover {
      border-color: var(--accent-burgundy);
      color: var(--accent-burgundy);
    }

    .az-btn.active {
      background: var(--accent-burgundy);
      color: #fff;
      border-color: var(--accent-burgundy);
    }

    /* 主卡片容器 */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .lexicon-card {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      box-shadow: 0 12px 35px rgba(35, 31, 32, 0.06);
      border-radius: 6px;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .lexicon-card { grid-template-columns: 1fr; }
    }

    /* 左側印象派油畫區 */
    .artwork-pane {
      position: relative;
      background: #eae2d3;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-right: 1px solid var(--border-line);
    }

    .artwork-pane img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .artwork-pane:hover img {
      transform: scale(1.03);
    }

    .letter-watermark {
      position: absolute;
      top: 1rem;
      left: 1.2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    /* 右側內容區 */
    .content-pane {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      border-bottom: 1px solid var(--border-line);
      padding-bottom: 1rem;
      margin-bottom: 1.2rem;
    }

    .word-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent-burgundy);
      line-height: 1.1;
    }

    .word-pos {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--ink-muted);
      margin-left: 0.4rem;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid var(--accent-burgundy);
      background: transparent;
      color: var(--accent-burgundy);
      font-family: 'Noto Serif TC', serif;
      font-size: 0.85rem;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .audio-btn:hover, .audio-btn.playing {
      background: var(--accent-burgundy);
      color: #fff;
    }

    .meaning-box {
      margin-bottom: 1.5rem;
    }

    .meaning-zh {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .meaning-note {
      font-size: 0.95rem;
      color: var(--ink-muted);
    }

    .quote-box {
      background: #f9f5ed;
      border-left: 3px solid var(--accent-gold);
      padding: 1.2rem 1.4rem;
      margin-bottom: 1.5rem;
      border-radius: 0 4px 4px 0;
    }

    .quote-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--ink-primary);
      margin-bottom: 0.5rem;
      line-height: 1.45;
    }

    .quote-en mark {
      background: rgba(176, 141, 87, 0.25);
      color: var(--accent-burgundy);
      font-weight: 700;
      padding: 0 3px;
      border-radius: 2px;
    }

    .quote-zh {
      font-size: 0.9rem;
      color: var(--ink-muted);
      margin-bottom: 0.8rem;
    }

    .quote-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .play-source {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--border-line);
    }

    .nav-step {
      background: none;
      border: none;
      color: var(--ink-muted);
      font-family: 'Noto Serif TC', serif;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .nav-step:hover {
      color: var(--accent-burgundy);
      text-decoration: underline;
    }

    .status-toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--ink-primary);
      color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 4px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .status-toast.show { opacity: 1; }
  </style>
